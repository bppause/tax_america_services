    <title>Tax America Services</title>

    <!-- PWA + mobile polish. theme-color tints the Android status bar
         when installed; apple-mobile-web-app-* gives iOS a chrome-less
         standalone render. The manifest powers the install prompt and
         the standalone start_url. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Tax America" />
    <link rel="apple-touch-icon" href="/tax/tax-america-services-logo.png" />

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>" />

  </body>
